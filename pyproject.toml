[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stakeholder-map"
version = "1.0.0"
description = "Mapa interactivo de stakeholders (poder-interés, red de conexiones y matriz de Mendelow) a partir de un Excel."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Uso interno" }
authors = [{ name = "Arup Bogotá - Transport Planning" }]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stakeholder-map = "stakeholder_map.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stakeholder_map.render" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
